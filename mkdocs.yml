INHERIT: docs/mkdocs-base.yml

site_name: jointview
site_description: A small marimo GUI for comparing two price or NAV series of a Polars DataFrame.
site_author: Jebel Quant
site_url: https://jebel-quant.github.io/jointview/
repo_url: https://github.com/Jebel-Quant/jointview
repo_name: Jebel-Quant/jointview
copyright: Copyright &copy; 2026 Jebel Quant

# Set explicitly, as docs/mkdocs-base.yml asks: a relative docs_dir inherited from
# that file would resolve against docs/, not against this file.
docs_dir: docs

nav:
  - Home: index.md
  - API Reference: api.md
  # Written by `make book`, which copies _tests/ to docs/reports/ before building.
  - Reports:
      - Test Report: reports/html-report/report.html
      - Coverage Report: reports/html-coverage/index.html

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Jebel-Quant/jointview

theme:
  icon:
    logo: material/chart-line

# Listed in full rather than as an override: nav and plugins are replaced by the child
# config, not merged, so naming only mkdocstrings here would drop the base's search.
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
