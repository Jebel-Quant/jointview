[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[project]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [{ name = "Thomas Schmelzer", email = "thomas.schmelzer@gmail.com" }]
name = "jointview"
version = "0.2.0"
description = "A small marimo GUI for comparing two price or NAV series of a Polars DataFrame."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "altair>=5.4",
    "jquantstats>=0.10,<=1.0",
    "marimo>=0.13",
    "numpy>=1.26",
    "polars>=1.0",
]

[project.scripts]
jointview = "jointview.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "vl-convert-python>=1.7",
]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.check_test_layout]
enforce = false
reason = "tests are organised by behaviour, not by module — test_columns.py covers plot.py's column helpers alongside test_plot.py's chart building. Per-module coverage is guaranteed instead by the full coverage gate in COVERAGE_FAIL_UNDER. Keep this string free of literal percent signs: radon reads the file through configparser, which reads them as interpolation syntax and raises."

[project.urls]
Homepage = "https://github.com/Jebel-Quant/jointview"
Repository = "https://github.com/Jebel-Quant/jointview"

[tool.bumpversion]
current_version = "0.2.0"
tag = false
commit = false
allow_dirty = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '(?ms)^\[project\]((?:(?!^\[)[\s\S])*?)^version = "{current_version}"'
replace = '[project]\1version = "{new_version}"'
