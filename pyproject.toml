[build-system]
requires = ["uv_build>=0.8.3,<0.12.0"]
build-backend = "uv_build"

[project]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [{ name = "Thomas Schmelzer", email = "thomas.schmelzer@gmail.com" }]
name = "jointview"
version = "0.1.0"
description = "A small marimo GUI for comparing two price or NAV series of a Polars DataFrame."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "altair>=5.4",
    "marimo>=0.13",
    "numpy>=1.26",
    "polars>=1.0",
]

[project.scripts]
jointview = "jointview.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "vl-convert-python>=1.7",
]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/Jebel-Quant/jointview"
Repository = "https://github.com/Jebel-Quant/jointview"

[tool.bumpversion]
current_version = "0.1.0"
tag = false
commit = false
allow_dirty = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '(?ms)^\[project\]((?:(?!^\[)[\s\S])*?)^version = "{current_version}"'
replace = '[project]\1version = "{new_version}"'
