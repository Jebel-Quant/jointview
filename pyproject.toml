# hatchling rather than uv_build, for one reason: the version below is derived from the
# git tag, and uv_build has no VCS version plugin. Under `dynamic = ["version"]` it does
# not fall back -- it refuses the build outright ("missing field `version`"). hatch-vcs
# is also what the rest of the fleet uses, so there is one packaging story to know.
#
# The built artifacts are unchanged by the switch: same nine modules including py.typed,
# same entry point, same LICENSE in dist-info/licenses/. Verified by diffing the wheel
# and sdist listings against the uv_build ones.
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Supplies the `version` that [project] declares dynamic, from `git describe`. Two
# consequences worth knowing:
#   * The build needs the tag to be visible. hatch-vcs does not fail without it -- it
#     falls back to a dev version like 0.3.4.dev3+g<sha> -- so rhiza_release.yml checks
#     the built distribution's filename against the tag, and its checkout uses
#     fetch-depth: 0. An sdist carries the resolved number in PKG-INFO, so building from
#     one needs no git.
#   * Between tags the local version is the *next* patch as a dev release
#     (guess-next-dev, the default), which is why nothing pins a fallback-version here:
#     a wrong-looking version must surface as a release failure, not as a plausible
#     constant.
[tool.hatch.version]
source = "vcs"

# uv_build inferred the package from the src/ layout; hatchling needs it named.
[tool.hatch.build.targets.wheel]
packages = ["src/jointview"]

# Also needed by the switch, and less obvious than the wheel: hatchling's default sdist
# is everything git tracks, where uv_build shipped only the package plus its metadata.
# Left at the default, `uv build` would publish the workflows, docs, tests, Makefile and
# uv.lock to PyPI -- a much larger artifact than any release before it. This keeps the
# previous contents. PKG-INFO carries the resolved version, so a build from the sdist
# needs no git history.
#
# Note this leaves jointview's sdist deliberately narrower than the fleet's other
# hatchling repos, whose sdists do ship the whole tracked tree. That is their existing
# behaviour and not this change's to alter; here the narrow set *is* the existing
# behaviour. hatchling adds .gitignore regardless of `include`, the one file the
# uv_build sdist did not carry.
[tool.hatch.build.targets.sdist]
include = [
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "src/jointview",
]

[project]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [{ name = "Thomas Schmelzer", email = "thomas.schmelzer@gmail.com" }]
name = "jointview"
# Derived from the git tag by hatch-vcs (see [tool.hatch.version]) rather than written
# here, so the tag is the single source of truth and a release is `git tag` alone -- no
# bump commit, and no way for a number in this file to disagree with what was tagged.
dynamic = ["version"]
description = "A small marimo GUI for comparing two price or NAV series of a Polars DataFrame."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "altair>=5.4",
    "jquantstats>=0.10,<=1.0",
    "marimo>=0.13",
    "numpy>=1.26",
    "polars>=1.0",
]

[project.scripts]
jointview = "jointview.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "vl-convert-python>=1.7",
]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.rhiza-task]
# The developer tasks come from `rhiza-task` on PyPI (see Makefile and CLAUDE.md); this is
# where what used to be a make variable, or a shadowed target, is said instead.
#
# pytest-rhiza from PyPI, pinned exactly rather than floored: a gate that moves under you
# is not a gate. rhiza-task's own default still names a git tag, one patch behind.
#
# 0.6.0 is required by this repo's dynamic [project].version, not merely available: it is
# the first release whose test_pyproject accepts a version derived from the VCS. Under
# 0.2.1 three of its assertions read `[project].version` as the empty string and fail --
# the required-field check, the semver shape, and the tag-agreement one -- because they
# predate `dynamic = ["version"]` being a thing a rhiza project could do. 0.6.0 skips each
# with a reason instead. jquantstats, which made this move first, pins the same version.
pytest-rhiza = "pytest-rhiza==0.6.0"
# docs/api.md is generated from the docstrings, and zensical does not ship mkdocstrings.
mkdocs-extra-packages = ["mkdocstrings[python]"]
# The CI OS matrix, moved here when `.rhiza/.env` went: it is the only setting that file
# still carried which is not already rhiza-task's own default. `rhiza_ci.yml`'s
# `generate-matrix` job asks `uvx rhiza-task ci-os-matrix`, which reads this table, so the
# three-OS fan-out survives the file. Leaving it unset would silently narrow CI to
# ubuntu-latest alone — the package builds pure-Python wheels but reads paths and spawns a
# marimo server, which is exactly what Windows and macOS are here to catch.
ci-os-matrix = ["ubuntu-latest", "macos-latest", "windows-latest"]

[tool.check_test_layout]
enforce = false
reason = "tests sit flat in tests/, one file per module, rather than mirroring the package path the checker looks for at tests/jointview/. Per-module coverage is guaranteed instead by the full coverage gate in COVERAGE_FAIL_UNDER. Keep this string free of literal percent signs: radon reads the file through configparser, which reads them as interpolation syntax and raises."

[project.urls]
Homepage = "https://github.com/Jebel-Quant/jointview"
Repository = "https://github.com/Jebel-Quant/jointview"

# No current_version, and no [[tool.bumpversion.files]] entry for pyproject.toml:
# [project].version is dynamic, derived from the git tag, so there is no number in any
# file for a bump to rewrite. bump-my-version resolves the current version from the
# newest reachable tag instead -- the same answer hatch-vcs gives -- so it still
# proposes the right next number. Re-adding either would break rather than no-op: a
# stale current_version drifts silently, and a `search` pattern that occurs zero times
# is an error to bump-my-version and to the check-bumpversion-config hook.
[tool.bumpversion]
tag = false
commit = false
allow_dirty = false
