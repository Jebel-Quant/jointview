repository: "jebel-quant/rhiza"
ref: "v1.5.0"

profiles:
  - github-project

templates:
  # SECURITY.md, CODE_OF_CONDUCT.md and CONTRIBUTING.md. LICENSE is excluded below.
  - legal

# Destination paths the sync must not deliver. A directory entry covers everything
# under it.
exclude:
  # The template's LICENSE. `legal` is synced for SECURITY.md and the community docs,
  # but the licence text is this repository's own: the bundle ships MIT under
  # "Copyright (c) 2025 Jebel Quant Research", which is not this repo's holder.
  - LICENSE

  # The template's MARIMO.md and TESTS.md, dropped in #24 along with their mkdocs nav
  # entries: this repo documents both subjects in CLAUDE.md and README.md instead, and
  # a page mkdocs does not link to is a page nobody reads. Recorded here rather than
  # simply deleted, because a deletion alone is undone by the next sync.
  - docs/development

  # The template's own test suite, replaced by the pytest-rhiza plugin: the same checks
  # arrive installed (`[tool.rhiza-task]` in pyproject.toml pins the version), so a synced
  # copy would be a second, older copy of code that is no longer edited here.
  #
  # This one used to be load-bearing in both directions: excluding the folder made
  # `rhiza-test` in quality.mk hit its "no directory" branch, which printed a WARN and
  # exited 0 — a green gate measuring nothing — so the `Makefile` had to shadow the target
  # to stop that. With quality.mk gone the plugin *is* the implementation and the
  # silent-pass branch no longer exists, so the exclusion now stands on its own.
  - .rhiza/tests

  # The release workflow, trimmed of its conda and devcontainer jobs. Unlike every other
  # workflow here this file is synced whole rather than delegating to a reusable one — the
  # PyPI publish must run under this repository's identity for Trusted Publishing — so the
  # only place to say "this repo has no devcontainer and no feedstock" is the copy itself.
  # Excluding it keeps that edit, at the price of not receiving upstream fixes to the
  # release pipeline: check the template's version by hand when one lands.
  - .github/workflows/rhiza_release.yml

  # The template's PAT_TOKEN and release-secret walkthrough. It documents secrets a
  # consumer configures once in the GitHub UI, addressed to whoever set the repo up rather
  # than to anyone reading the tree — and this repo publishes to PyPI by Trusted Publishing,
  # so the page's central subject does not apply. Upstream is where it belongs, and where it
  # stays.
  - .github/CONFIG.md

  # The two opt-in workflows that arrived with v1.4.2, both OFF by default and neither
  # opted into here: `rhiza_mutation.yml` runs only when the repository variable
  # MUTATION_ENABLED is 'true', and `rhiza_fuzzing.yml` needs FUZZING_ENABLED plus a
  # `.clusterfuzzlite/` config this repo does not have. Mutation's gate is in the caller,
  # so the job never starts; fuzzing's is inside the reusable workflow, so it does start
  # on every pull request and every push to main in order to skip — a green check whose
  # only content is that it had nothing to do.
  #
  # Declining them is a judgement about this package, not about the workflows: jointview
  # is a marimo app over two Polars columns, with no parser and no untrusted input for a
  # fuzzer to reach, and the assertion-strength question mutation testing answers is one
  # `make test`'s 100% line coverage on ~seven small modules already answers cheaply.
  # Recorded here rather than simply deleted, because a deletion alone is undone by the
  # next sync.
  - .github/workflows/rhiza_fuzzing.yml
  - .github/workflows/rhiza_mutation.yml

  # The issue forms, `bug_report.yml` and `feature_request.yml`. Two 98-line forms with
  # required fields, arriving at a template tag, for a repository whose issues are opened by
  # the person who wrote the code: the friction lands entirely on the one contributor a
  # form's structure was never meant to discipline, and a required "steps to reproduce"
  # textarea is not what makes a one-line note about a chart axis easier to file. Issues stay
  # enabled and free-form. Recorded here rather than simply deleted, because a deletion alone
  # is undone by the next sync.
  - .github/ISSUE_TEMPLATE

  # The three discussion forms, `help-wanted.yml`, `ideas.yml` and `q-and-a.yml`. The same
  # judgement as the issue forms above, for the same repository: a form's structure
  # disciplines a crowd, and there is no crowd here. Discussions is switched off besides, so
  # the forms were inert even while they sat in the tree.
  #
  # This entry is the whole point. #56 deleted the directory and the v1.4.2 sync wrote it
  # straight back, because a deletion is not a refusal — the exact trap the paragraph above
  # keeps warning about, sprung. v1.5.0 happens to drop the forms from the template, so the
  # sync deletes them now, but that is upstream's decision and upstream can revisit it. This
  # line is what makes the refusal this repo's own.
  - .github/DISCUSSION_TEMPLATE
