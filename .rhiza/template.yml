repository: "jebel-quant/rhiza"
ref: "v1.3.3"

profiles:
  - github-project

# Destination paths the sync must not deliver. A directory entry covers everything
# under it.
exclude:
  # The template's MARIMO.md and TESTS.md, dropped in #24 along with their mkdocs nav
  # entries: this repo documents both subjects in CLAUDE.md and README.md instead, and
  # a page mkdocs does not link to is a page nobody reads. Recorded here rather than
  # simply deleted, because a deletion alone is undone by the next sync.
  - docs/development

  # The make layer, replaced by the `rhiza-task` CLI on PyPI: `.rhiza/rhiza.mk` plus ten
  # fragments under `.rhiza/make.d/`, 1023 lines synced at a template tag, for one pinned
  # package version in `Makefile`. Recorded as exclusions rather than simply deleted,
  # because a deletion alone is undone by the next sync.
  #
  # `.rhiza/rhiza.mk` outlived the rest by one caller: rhiza_ci.yml's `generate-matrix` job
  # ran `make -f .rhiza/rhiza.mk -s ci-os-matrix`, so a repo with no make layer still had to
  # keep four lines at that path. @v1.3.4 asks the CLI instead (jebel-quant/rhiza#1546), and
  # the file is gone; the exclusion is all that stays behind.
  - .rhiza/make.d
  - .rhiza/rhiza.mk

  # The template's own test suite, replaced by the pytest-rhiza plugin: the same checks
  # arrive installed (`[tool.rhiza-task]` in pyproject.toml pins the version), so a synced
  # copy would be a second, older copy of code that is no longer edited here.
  #
  # This one used to be load-bearing in both directions: excluding the folder made
  # `rhiza-test` in quality.mk hit its "no directory" branch, which printed a WARN and
  # exited 0 — a green gate measuring nothing — so the `Makefile` had to shadow the target
  # to stop that. With quality.mk gone the plugin *is* the implementation and the
  # silent-pass branch no longer exists, so the exclusion now stands on its own.
  - .rhiza/tests
