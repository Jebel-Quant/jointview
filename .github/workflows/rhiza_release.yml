# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# ⚠️  WHY THIS WORKFLOW CANNOT USE A STUB
#
# Rhiza normally distributes workflows as thin stubs that delegate to a reusable
# workflow in this repository via `workflow_call`. That pattern cannot be used here
# because PyPI Trusted Publishing (OIDC) validates the *exact* workflow file path
# and repository that invokes `pypa/gh-action-pypi-publish`. When a stub delegates
# to a reusable workflow in jebel-quant/rhiza, PyPI sees rhiza's repository as the
# publisher — not the downstream project's — and rejects the OIDC token. This file
# must therefore be synced directly into each downstream project so that the publish
# step runs under the correct repository identity.
#
# jointview: taken from the template at v1.13.0 with the conda-recipe and devcontainer
# jobs removed — no feedstock and no .devcontainer here. Excluded from the sync in
# .rhiza/template.yml, so upstream fixes have to be carried over by hand.
#
# Release Workflow for Python Packages
#
# This workflow implements a secure, maintainable release pipeline with distinct phases:
#
# 📋 Pipeline Phases:
#   1. 🔍 Validate Tag - Check tag format and ensure release doesn't already exist
#   2. 🏗️ Build - Build Python package with Hatch (if [build-system] is defined in pyproject.toml)
#   3. 📦 Generate SBOM - Create Software Bill of Materials (CycloneDX format)
#   4. 📝 Draft Release - Create draft GitHub release with build artifacts and SBOM
#   5. 🚀 Publish package - PyPI-compatible upload, repository-owned action, or none
#   6. ✅ Finalize Release - Publish the GitHub release with links
#
# 📄 CHANGELOG: not updated here. The release process (rhiza-claude `/release`)
# folds a freshly generated CHANGELOG.md into the version-bump commit before the
# tag is pushed, so the tagged commit already carries the changelog — no separate
# post-tag commit.
#
# 📦 SBOM Generation:
#   - Generated using CycloneDX format (industry standard for software supply chain security)
#   - Creates both JSON and XML formats for maximum compatibility
#   - SBOM attestations are created and stored (public repos only)
#   - Attached to GitHub releases for transparency and compliance
#   - Skipped if pyproject.toml doesn't exist
#
# 🚀 Package Publishing:
#   - RELEASE_PUBLISHER: pypi (default), custom, or none; unknown modes fail closed
#   - pypi retains the private classifier skip and OIDC/token-based feed support
#   - custom explicitly permits private distributions and requires the repo-owned
#     .github/actions/release-publish composite action; no implementation is shipped
#   - custom receives artifacts-dir, tag, version, and optional opaque credentials
#   - the action uploads already-built distributions, not provenance, and may return
#     artifact-url (one public credential-free HTTPS URL) for the release notes
#   - required downloads and failed uploads fail the release; none skips package upload
#
# 🔐 Security:
#   - No PyPI credentials stored; relies on Trusted Publishing via GitHub OIDC
#   - For custom feeds, PYPI_TOKEN secret is used with default username __token__
#   - SLSA provenance attestations generated for build artifacts (public repos only)
#   - SBOM attestations generated for supply chain transparency (public repos only)
#
# 📄 Requirements:
#   - pyproject.toml declaring a version (for Python packages): either written as
#     `[project].version`, or listed in `[project].dynamic` for the build backend to
#     derive from the VCS (hatch-vcs, setuptools-scm). A derived version is checked
#     against the tag on the built distribution rather than in the file.
#   - Package registered on PyPI as Trusted Publisher (for PyPI publishing)
#
# ✅ To Trigger:
#   Create and push a version tag:
#     git tag v1.2.3
#     git push origin v1.2.3
#
# 🎯 For repos without Python packages:
#   The workflow gracefully skips Python-related steps if pyproject.toml doesn't exist.


name: (RHIZA) RELEASE

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v1.2.3). Required when called via workflow_call.'
        required: true
        type: string
    secrets:
      RHIZA_SETUP_CREDENTIALS:
        required: false
      GH_PAT:
        required: false
      UV_EXTRA_INDEX_URL:
        required: false
      PYPI_TOKEN:
        required: false
      RELEASE_PUBLISH_CREDENTIALS:
        required: false

# Queue runs instead of cancelling: a release or sync must never be
# interrupted mid-publish or mid-push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege default: every job below re-declares exactly the write
# scopes it needs (Scorecard Token-Permissions). Top-level stays read-only.
permissions:
  contents: read

# The CLI the build job validates distributions with (`dist-check`). Pinned like every other
# workflow's RHIZA_TASK, and moved with them by the same Renovate rule, so the release and CI
# run one version of the check rather than two.
env:
  RHIZA_TASK: rhiza-task@1.10.0

jobs:
  tag:
    name: Validate Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read   # Validation only: reads tags and release state
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set Tag Variable
        id: set_tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)*([a-zA-Z0-9.+-]*)$ ]]; then
            echo "::error::Invalid release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.set_tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            DRAFT_STATUS=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            if [ "$DRAFT_STATUS" != "true" ]; then
              echo "::error::Release '$TAG' already exists and is not a draft. Please use a new tag."
              exit 1
            else
              echo "::warning::Release '$TAG' exists as a draft. Will proceed to update it."
            fi
          fi

      - name: Ensure the tagged commit is reachable from a branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.set_tag.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Backstop for issue #1454: a release cut on a branch that is then
          # squash-merged leaves the tag on the pre-squash commit, and the squash
          # puts the same content on the default branch under a new SHA. The tag is
          # then permanently orphaned — no branch contains it, `git describe` skips
          # the release, and a git-cliff regeneration silently deletes that version's
          # CHANGELOG section because it cannot place a boundary at an unreachable
          # tag. Publishing from such a tag is never intended, so refuse it.
          # The checkout above uses fetch-depth: 0; this fetch only adds the remote
          # branch refs, which a tag-push checkout does not need otherwise.
          git fetch --no-tags --quiet origin '+refs/heads/*:refs/remotes/origin/*'

          if [ -z "$DEFAULT_BRANCH" ]; then
            DEFAULT_BRANCH=$(gh repo view --json defaultBranchRef --jq '.defaultBranchRef.name')
          fi
          if ! git rev-parse --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH" >/dev/null; then
            echo "::error::Cannot resolve the default branch 'origin/$DEFAULT_BRANCH' — refusing to release without a reachability check."
            exit 1
          fi

          COMMIT=$(git rev-parse "$TAG^{commit}")
          if git merge-base --is-ancestor "$COMMIT" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "✅ $TAG ($COMMIT) is an ancestor of $DEFAULT_BRANCH"
            exit 0
          fi

          # Reachable from some other branch: a maintenance/hotfix release. Legitimate,
          # but a changelog regenerated from the default branch still cannot see it.
          BRANCHES=$(git branch -r --contains "$COMMIT" --format='%(refname:short)')
          if [ -n "$BRANCHES" ]; then
            echo "::warning::Tag $TAG is not an ancestor of $DEFAULT_BRANCH; it is contained in: $(echo "$BRANCHES" | tr '\n' ' '). A CHANGELOG regenerated from $DEFAULT_BRANCH will not include this release."
            exit 0
          fi

          echo "::error::Tag $TAG points at $COMMIT, which no branch contains. It is most likely a pre-squash commit from a squash-merged release branch: re-tag the merged commit on $DEFAULT_BRANCH and delete this tag (issue #1454)."
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Ensure release version is newer than latest published
        env:
          TAG: ${{ steps.set_tag.outputs.tag }}
        run: |
          # Backstop for issue #1126: refuse a tag that is not strictly newer than the
          # highest version already released. A diverged branch with a stale pyproject.toml
          # can otherwise publish an older version (e.g. v0.3.3 after v0.4.0). The bump
          # tooling enforces the same rule; this guards manually-pushed tags too.
          git tag -l 'v*' | uv run --with packaging --no-project python3 -c '
          import sys
          from packaging.version import Version, InvalidVersion

          new = sys.argv[1].lstrip("v")
          try:
              new_v = Version(new)
          except InvalidVersion:
              print(f"::error::Tag {sys.argv[1]} is not a valid version")
              sys.exit(1)

          latest = None
          for line in sys.stdin:
              tag = line.strip().lstrip("v")
              if not tag:
                  continue
              try:
                  candidate = Version(tag)
              except InvalidVersion:
                  continue
              if candidate == new_v:
                  continue
              if latest is None or candidate > latest:
                  latest = candidate

          if latest is not None and new_v <= latest:
              print(
                  f"::error::Refusing to release v{new_v}: it is not newer than the latest "
                  f"released version v{latest} (issue #1126). Sync with the default branch and bump again."
              )
              sys.exit(1)
          print(f"v{new_v} is newer than the latest released version v{latest}" if latest
                else f"v{new_v} is the first release")
          ' "$TAG"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: tag
    permissions:
      contents: read
      id-token: write       # OIDC for attestation signing
      attestations: write   # SLSA provenance + SBOM attestations (public repos only)
    outputs:
      buildable: ${{ steps.buildable.outputs.buildable }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"

      - name: Validate consumer dependency setup
        if: ${{ vars.RHIZA_SETUP_ENABLED == 'true' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CALLER_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request_target" ] ||
             { [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPOSITORY" != "$CALLER_REPOSITORY" ]; }; then
            echo "::error::Consumer setup is not allowed on fork pull requests or pull_request_target."
            exit 1
          fi
          if [ ! -f .github/actions/rhiza-setup/action.yml ] && [ ! -f .github/actions/rhiza-setup/action.yaml ]; then
            echo "::error::RHIZA_SETUP_ENABLED=true requires .github/actions/rhiza-setup/action.yml or action.yaml."
            exit 1
          fi

      - name: Run consumer dependency setup
        if: ${{ vars.RHIZA_SETUP_ENABLED == 'true' }}
        uses: ./.github/actions/rhiza-setup
        with:
          purpose: ${{ github.job }}
          credentials: ${{ secrets.RHIZA_SETUP_CREDENTIALS }}

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Verify version matches tag
        if: hashFiles('pyproject.toml') != ''
        env:
          # Read from the environment, not interpolated into the script: that is what
          # lets tests/api/test_release_version_verification.py run this exact shell
          # against purpose-built projects instead of asserting on the step's name.
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          TAG_VERSION="${TAG#v}"

          # Normalize tag version to PEP 440 format for comparison.
          # Tags use semver format (e.g., 0.11.1-beta.1) while uv version --short
          # returns PEP 440 normalized format (e.g., 0.11.1b1).
          NORMALIZED_TAG=$(uv run --with packaging --no-project python3 -c "from packaging.version import Version; print(Version('$TAG_VERSION'))")

          # A project may derive its version from the VCS rather than write one: PEP 621's
          # `dynamic = ["version"]` with a backend plugin such as hatch-vcs. There is then
          # no number in the file to compare, and `uv version --short` does not return a
          # differing one -- it exits 2 ("We cannot get or set dynamic project versions"),
          # which would fail every release of such a project. The tag-versus-version check
          # moves to "Verify built distribution matches the tag" below, which is where a
          # derived version can actually be wrong.
          DYNAMIC=$(uv run --with tomli --no-project python3 -c "
          import pathlib, tomli
          project = tomli.loads(pathlib.Path('pyproject.toml').read_text()).get('project') or {}
          print('dynamic' if 'version' in (project.get('dynamic') or []) else 'written')")

          case "$DYNAMIC" in
            dynamic)
              echo "[project].version is dynamic: derived from the VCS, so there is no written number to compare against $NORMALIZED_TAG. The distribution built below is checked against the tag instead."
              exit 0
              ;;
            written)
              ;;
            *)
              # Never assume "written": that would call `uv version --short` on a dynamic
              # project and fail with an error about the probe, not about the release.
              echo "::error::Could not tell whether [project].version is written or dynamic (probe returned '$DYNAMIC')"
              exit 1
              ;;
          esac

          PROJECT_VERSION=$(uv version --short)
          if [[ "$PROJECT_VERSION" != "$NORMALIZED_TAG" ]]; then
            echo "::error::Version mismatch: pyproject.toml has '$PROJECT_VERSION' but tag is '$NORMALIZED_TAG' (from tag '$TAG_VERSION')"
            exit 1
          fi
          echo "Version verified: $PROJECT_VERSION matches tag (normalized: $NORMALIZED_TAG)"

      - name: Detect buildable Python package
        id: buildable
        run: |
          if [[ -f pyproject.toml ]] && grep -q '^\[build-system\]' pyproject.toml; then
            echo "buildable=true" >> "$GITHUB_OUTPUT"
          else
            echo "buildable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and validate distributions
        if: steps.buildable.outputs.buildable == 'true'
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL || env.UV_EXTRA_INDEX_URL }}
        # `dist-check` builds into dist/ and then reads the artifacts back before anything is
        # uploaded (#1743): every declared licence file must be in each archive and recorded as
        # a License-File, and a wheel rebuilt from the sdist -- outside the checkout, with
        # version overrides removed -- must agree with the rest. dist/ is left holding exactly
        # what passed, and that folder is what the jobs below publish; nothing rebuilds it.
        # `--strict`, because a skip here would mean nothing was built, and an empty dist/
        # must not reach the publish job as a pass.
        run: uvx "$RHIZA_TASK" dist-check --strict

      - name: Verify built distribution matches the tag
        if: steps.buildable.outputs.buildable == 'true'
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          # The only place a version *derived* from the VCS can be caught being wrong.
          # hatch-vcs and setuptools-scm fall back rather than fail, so a checkout that
          # cannot see the tag builds `0.1.dev1+g<sha>` and publishes it under a green
          # tick with no error anywhere -- which is why the checkout above uses
          # fetch-depth: 0. Runs for a written version too: it costs one filename parse
          # and closes the gap between what the step above read and what `uv build`
          # actually produced.
          TAG_VERSION="${TAG#v}"
          uv run --with packaging --no-project python3 -c '
          import pathlib
          import sys

          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          expected = Version(sys.argv[1])
          dist = pathlib.Path("dist")
          built = sorted(dist.glob("*.whl")) + sorted(dist.glob("*.tar.gz"))
          if not built:
              print("::error::uv build produced no distribution in dist/ -- there is nothing to publish or verify")
              sys.exit(1)

          mismatched = []
          for artifact in built:
              parse = parse_wheel_filename if artifact.name.endswith(".whl") else parse_sdist_filename
              found = parse(artifact.name)[1]
              print(f"{artifact.name}: {found}")
              if found != expected:
                  mismatched.append(f"{artifact.name} carries {found}")

          if mismatched:
              print(
                  f"::error::Built distribution does not carry the release version {expected}: "
                  + ", ".join(mismatched)
                  + ". A version derived from the VCS falls back to a dev version when the tag "
                  "is not visible to the build -- check the checkout depth and that tags were fetched."
              )
              sys.exit(1)
          print(f"Built distribution verified at {expected}")
          ' "$TAG_VERSION"

      - name: Install Python for SBOM generation
        if: hashFiles('pyproject.toml') != ''
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Sync environment for SBOM generation
        if: hashFiles('pyproject.toml') != ''
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL || env.UV_EXTRA_INDEX_URL }}
        run: |
          uv sync --all-extras --all-groups --frozen

      - name: Generate SBOM (CycloneDX)
        if: hashFiles('pyproject.toml') != ''
        run: |
          printf "[INFO] Generating SBOM in CycloneDX format...\n"
          # Note: uvx caches the tool environment, so the second call is fast
          uvx --from 'cyclonedx-bom>=7.0.0' cyclonedx-py environment --pyproject pyproject.toml --of JSON -o sbom.cdx.json
          uvx --from 'cyclonedx-bom>=7.0.0' cyclonedx-py environment --pyproject pyproject.toml --of XML -o sbom.cdx.xml
          printf "[INFO] SBOM generation complete\n"
          printf "Generated files:\n"
          ls -lh sbom.cdx.*

      - name: Attest SBOM
        # Attest only the JSON format as it's the canonical machine-readable format.
        # The XML format is provided for compatibility but doesn't need separate attestation.
        id: attest-sbom
        if: hashFiles('pyproject.toml') != '' && github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: sbom.cdx.json
          sbom-path: sbom.cdx.json

      - name: Stage SBOM attestation for the GitHub release
        # Attach the SBOM's Sigstore attestation bundle to the release as a
        # recognised signature asset (*.sigstore.json). Non-buildable repos
        # (no [build-system], so no dist/*.intoto.jsonl provenance) would
        # otherwise ship releases without any signature asset, which fails
        # OpenSSF Scorecard's Signed-Releases check.
        if: hashFiles('pyproject.toml') != '' && github.event.repository.private == false
        env:
          BUNDLE_PATH: ${{ steps.attest-sbom.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" sbom.cdx.json.sigstore.json

      - name: Upload SBOM artifacts
        if: hashFiles('pyproject.toml') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            sbom.cdx.json
            sbom.cdx.xml
            sbom.cdx.json.sigstore.json

      - name: Generate SLSA provenance attestations
        id: provenance
        if: steps.buildable.outputs.buildable == 'true' && github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Stage provenance bundle for the GitHub release
        # Attach the SLSA provenance bundle to the release as a recognised
        # signature asset (*.intoto.jsonl) so consumers — and OpenSSF
        # Scorecard's Signed-Releases check — can verify the artifacts.
        if: steps.buildable.outputs.buildable == 'true' && github.event.repository.private == false
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/provenance.intoto.jsonl

      - name: Upload dist artifact
        if: steps.buildable.outputs.buildable == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist

  # Don't try to upload artifacts to GitHub Release at all
  draft-release:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    needs: [tag, build]
    permissions:
      contents: write   # Needed to create the GitHub release and upload artifacts

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Generate release notes with git-cliff
        run: uvx git-cliff --latest --output RELEASE_NOTES.md

      - name: Download SBOM artifact
        # Downloads sbom.cdx.json and sbom.cdx.xml into sbom/ directory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom
        continue-on-error: true

      - name: Download dist artifact
        # Brings in provenance.intoto.jsonl (and the built distributions) staged
        # by the build job, so the SLSA provenance ships as a release asset.
        if: needs.build.outputs.buildable == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create GitHub Release with artifacts
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ needs.tag.outputs.tag }}
          name: ${{ needs.tag.outputs.tag }}
          bodyFile: RELEASE_NOTES.md
          draft: true
          allowUpdates: true
          artifacts: "sbom/*,dist/provenance.intoto.jsonl"

  # Decide at step-level whether to publish
  pypi:
    name: Publish package
    runs-on: ubuntu-latest
    environment: release
    needs: [tag, build, draft-release]
    permissions:
      contents: read
      id-token: write   # PyPI or the explicitly selected repository-owned publisher
    outputs:
      should_publish: ${{ steps.publisher.outputs.should_publish }}
      public_pypi: ${{ steps.publisher.outputs.public_pypi }}
      publisher: ${{ steps.publisher.outputs.publisher }}
      artifact_url: ${{ steps.artifact_url.outputs.artifact_url }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout publisher guards
        # Independent of the caller's release tag: old tags need not contain helpers.
        # Upgrade only to an already-published immutable script revision, never a future release tag.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: jebel-quant/rhiza
          ref: 3819c35933d428626076e87345de59b81bb161ed
          path: .rhiza-release-tools
          sparse-checkout: bundles/github/.rhiza/scripts
          persist-credentials: false

      - name: Validate publisher configuration
        id: publisher
        env:
          RELEASE_PUBLISHER: ${{ vars.RELEASE_PUBLISHER }}
          PYPI_REPOSITORY_URL: ${{ vars.PYPI_REPOSITORY_URL }}
          BUILDABLE: ${{ needs.build.outputs.buildable }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          python3 .rhiza-release-tools/bundles/github/.rhiza/scripts/release_publish.py validate-publisher

      - name: Download dist artifact
        if: steps.publisher.outputs.should_publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ github.workspace }}/release-dist

      - name: Require built distributions
        if: steps.publisher.outputs.should_publish == 'true'
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/release-dist
        run: |
          python3 .rhiza-release-tools/bundles/github/.rhiza/scripts/release_publish.py require-distributions

      - name: Remove non-distribution files before publish
        # The provenance belongs to the GitHub release, not the package index.
        if: steps.publisher.outputs.should_publish == 'true' && steps.publisher.outputs.publisher == 'pypi'
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/release-dist
        run: rm -f "$ARTIFACTS_DIR"/*.intoto.jsonl

      - name: Publish to PyPI
        if: steps.publisher.outputs.should_publish == 'true' && steps.publisher.outputs.publisher == 'pypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: ${{ github.workspace }}/release-dist/
          skip-existing: true
          repository-url: ${{ vars.PYPI_REPOSITORY_URL }}
          password: ${{ secrets.PYPI_TOKEN }}

      - name: Publish with repository action
        id: custom_publish
        if: steps.publisher.outputs.should_publish == 'true' && steps.publisher.outputs.publisher == 'custom'
        uses: ./.github/actions/release-publish
        env:
          # Composite metadata cannot read vars; pass non-secret publisher configuration.
          RHIZA_RELEASE_PUBLISH_VARS: ${{ toJSON(vars) }}
        with:
          artifacts-dir: ${{ github.workspace }}/release-dist
          tag: ${{ needs.tag.outputs.tag }}
          version: ${{ steps.publisher.outputs.version }}
          credentials: ${{ secrets.RELEASE_PUBLISH_CREDENTIALS }}

      - name: Validate publisher artifact URL
        id: artifact_url
        if: steps.publisher.outputs.should_publish == 'true' && steps.publisher.outputs.publisher == 'custom'
        env:
          ARTIFACT_URL: ${{ steps.custom_publish.outputs.artifact-url }}
        run: |
          python3 .rhiza-release-tools/bundles/github/.rhiza/scripts/release_publish.py validate-artifact-url

  finalise-release:
    name: Finalise Release
    runs-on: ubuntu-latest
    needs: [tag, build, draft-release, pypi]
    # Every dependency must succeed: a failed upload leaves the release as a draft.
    # !cancelled() keeps upstream's guard against finalising a cancelled run (#1537);
    # with the conda and devcontainer jobs removed there is no optional job left.
    # Disabled uploads (RELEASE_PUBLISHER=none) complete their job successfully.
    if: ${{ !cancelled() && needs.tag.result == 'success' && needs.build.result == 'success' && needs.draft-release.result == 'success' && needs.pypi.result == 'success' }}
    permissions:
      contents: write   # Needed to undraft/publish the GitHub release
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          fetch-depth: 0

      - name: Generate PyPI Link
        id: pypi_link
        if: needs.pypi.outputs.should_publish == 'true' && needs.pypi.outputs.publisher == 'pypi' && needs.pypi.result == 'success'
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          REPO_URL: ${{ vars.PYPI_REPOSITORY_URL }}
        run: |
          PACKAGE_NAME=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['name'])")
          VERSION="$TAG"
          VERSION=${VERSION#v}

          if [ -z "$REPO_URL" ]; then
             LINK="https://pypi.org/project/$PACKAGE_NAME/$VERSION/"
             NAME="PyPI Package"
          else
             LINK="$REPO_URL"
             NAME="Custom Feed Package"
          fi

          {
            echo "message<<EOF"
            echo "### $NAME"
            echo ""
            echo "[$PACKAGE_NAME]($LINK)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Custom Publisher Link
        id: custom_link
        if: needs.pypi.outputs.publisher == 'custom' && needs.pypi.result == 'success' && needs.pypi.outputs.artifact_url != ''
        env:
          ARTIFACT_URL: ${{ needs.pypi.outputs.artifact_url }}
        run: |
          {
            echo "message<<EOF"
            printf '### Published Package\n\n<%s>\n' "$ARTIFACT_URL"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}
          PYPI_MSG: ${{ steps.pypi_link.outputs.message }}
          CUSTOM_MSG: ${{ steps.custom_link.outputs.message }}
        run: |
          # Get existing auto-generated release notes (gracefully handle missing release)
          EXISTING=$(gh release view "$TAG" --json body --jq '.body // ""' 2>/dev/null || echo "")

          # Append links to release body
          {
            printf '%s' "$EXISTING"
            for message in "$PYPI_MSG" "$CUSTOM_MSG"; do
              if [ -n "$message" ]; then
                printf '\n\n%s' "$message"
              fi
            done
          } > release-notes.md

          gh release edit "$TAG" --draft=false --notes-file release-notes.md
